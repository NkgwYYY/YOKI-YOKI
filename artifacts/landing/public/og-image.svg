<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A051A"/>
      <stop offset="0.52" stop-color="#21154A"/>
      <stop offset="1" stop-color="#5C3A86"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#D9B8FF" stop-opacity=".45"/>
      <stop offset=".55" stop-color="#A96CDB" stop-opacity=".14"/>
      <stop offset="1" stop-color="#A96CDB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D5B8FF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#090313" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="860" cy="315" r="300" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="1080" cy="85" r="4" fill="#fff" opacity=".85"/>
  <circle cx="942" cy="132" r="2.5" fill="#E5D7FF" opacity=".8"/>
  <circle cx="1060" cy="505" r="3" fill="#fff" opacity=".7"/>
  <circle cx="735" cy="82" r="2" fill="#fff" opacity=".8"/>
  <circle cx="660" cy="548" r="2.5" fill="#DABEFF" opacity=".7"/>
  <path d="M1010 88 l5 12 12 5-12 5-5 12-5-12-12-5 12-5z" fill="#fff" opacity=".72"/>
  <path d="M773 505 l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#D7B9FF" opacity=".75"/>

  <g transform="translate(86 92)">
    <rect x="0" y="0" width="214" height="42" rx="21" fill="#FFFFFF" fill-opacity=".12" stroke="#E6D6FF" stroke-opacity=".38"/>
    <text x="107" y="27" text-anchor="middle" fill="#F5EEFF" font-family="sans-serif" font-size="17" font-weight="700" letter-spacing="3">MENTAL CARE APP</text>

    <text x="0" y="133" fill="url(#accent)" font-family="sans-serif" font-size="76" font-weight="900" letter-spacing="2">YOKI YOKI</text>
    <rect x="3" y="157" width="78" height="6" rx="3" fill="#D6B6FF"/>
    <text x="0" y="220" fill="#FFFFFF" font-family="sans-serif" font-size="30" font-weight="700">YOUR DAILY MOMENT</text>
    <text x="0" y="265" fill="#FFFFFF" font-family="sans-serif" font-size="30" font-weight="700">BECOMES LIGHT.</text>
    <text x="0" y="326" fill="#D9C8F3" font-family="sans-serif" font-size="19">Mood tracking · AI chat · Grow together</text>
    <text x="0" y="357" fill="#D9C8F3" font-family="sans-serif" font-size="19">A gentle space for your everyday wellbeing.</text>

    <g transform="translate(0 410)">
      <rect x="0" y="0" width="126" height="38" rx="19" fill="#FFFFFF" fill-opacity=".13" stroke="#FFFFFF" stroke-opacity=".25"/>
      <text x="63" y="25" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">MOOD LOG</text>
      <rect x="138" y="0" width="132" height="38" rx="19" fill="#FFFFFF" fill-opacity=".13" stroke="#FFFFFF" stroke-opacity=".25"/>
      <text x="204" y="25" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">AI CHAT</text>
      <rect x="282" y="0" width="126" height="38" rx="19" fill="#FFFFFF" fill-opacity=".13" stroke="#FFFFFF" stroke-opacity=".25"/>
      <text x="345" y="25" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">GROW</text>
    </g>
  </g>

  <g transform="translate(745 90)" filter="url(#shadow)">
    <circle cx="205" cy="238" r="192" fill="#FFFFFF" fill-opacity=".08" stroke="#FFFFFF" stroke-opacity=".2"/>
    <circle cx="205" cy="238" r="154" fill="#FFFFFF" fill-opacity=".06"/>
  </g>
  <text x="950" y="570" text-anchor="middle" fill="#E9DFFF" font-family="sans-serif" font-size="16" letter-spacing="2">A SMALL CHECK-IN CAN BRIGHTEN YOUR WORLD.</text>
