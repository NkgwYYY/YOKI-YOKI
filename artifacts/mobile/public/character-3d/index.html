<!doctype html><html lang="ja"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOKI YOKI · 進化した仲間たち</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#efece3;color:#35413b;font-family:system-ui,-apple-system,sans-serif}main{max-width:1180px;margin:auto;padding:36px 32px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-size:12px;letter-spacing:.25em;color:#788878}h1{font-family:serif;font-size:33px;font-weight:500;margin:10px 0}p{font-size:14px;line-height:1.8;color:#788477;margin:8px 0}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 12px}button{font:inherit;cursor:pointer;border:1px solid #c8cec0;border-radius:24px;background:#f7f6ee;color:#46554b;padding:10px 17px;font-size:13px}button[aria-pressed=true]{background:#455e50;color:#fff;border-color:#455e50}button:focus-visible,canvas:focus-visible{outline:3px solid #af9958;outline-offset:3px}.lineup{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}.friend{position:relative;text-align:center;padding:12px 0 18px;min-width:0}.stage{position:relative;background:radial-gradient(ellipse at 50% 74%,#d0d8c9 0%,#e8ede1 30%,#f4f3e8 70%);border-radius:48% 48% 34% 34%;aspect-ratio:1;isolation:isolate}.stage:after{position:absolute;content:"";width:58%;height:8%;left:21%;bottom:7%;border-radius:50%;background:#727d6945;filter:blur(9px);z-index:-1}canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}h2{font-size:19px;letter-spacing:.08em;font-weight:500;margin:22px 0 5px}.sub{font-size:12px;color:#8b9687}footer{border-top:1px solid #ccd3c4;margin-top:28px;padding-top:18px;display:flex;justify-content:space-between;gap:20px;color:#84917f;font-size:12px}.hint{font-size:12px;margin:12px 0 24px}body.night{background:#242c36;color:#e5e8dc}body.night .stage{background:radial-gradient(ellipse at 50% 70%,#59696a,#343f4c 65%)}body.night p,body.night .sub{color:#b2bba9}@media(max-width:650px){main{padding:24px 20px}h1{font-size:26px}.lineup{grid-template-columns:1fr;gap:10px}.friend{max-width:370px;width:100%;margin:auto}header{display:block}.controls{margin-top:20px}button{padding:9px 13px}footer{display:block}}
</style><main><header><div><div class="brand">YOKI YOKI / OUR LITTLE FRIENDS</div><h1>進化した仲間たち</h1><p>ふわふわの毛、つぶらな目。くるっと回って、どこからでも。</p></div><button id="auto" aria-pressed="false">ゆっくり回す</button></header>
<nav class="controls" aria-label="見る方向"><button data-yaw="0" aria-pressed="true">正面</button><button data-yaw="0.65" aria-pressed="false">ななめ</button><button data-yaw="1.5707963" aria-pressed="false">横</button><button data-yaw="3.1415927" aria-pressed="false">後ろ</button><button data-pitch="0.6" aria-pressed="false">上から</button><button id="smile" aria-pressed="false">にっこり</button><button id="night" aria-pressed="false">夜の明かり</button></nav><p class="hint">キャラクターをなぞって、自由に回せます。保存中の進化や記録には影響しません。</p>
<section class="lineup"><article class="friend"><div class="stage"><canvas data-form="odango" aria-label="モフモフの立体モデル。矢印キーで回転" tabindex="0"></canvas></div><h2>モフモフ</h2><div class="sub">やわらかな白い毛並み</div></article><article class="friend"><div class="stage"><canvas data-form="stage3" aria-label="はっぱの立体モデル。矢印キーで回転" tabindex="0"></canvas></div><h2>はっぱ</h2><div class="sub">小さな芽も、ふっくら立体に</div></article><article class="friend"><div class="stage"><canvas data-form="stage4" aria-label="カラフルはっぱの立体モデル。矢印キーで回転" tabindex="0"></canvas></div><h2>カラフルはっぱ</h2><div class="sub">背中までつながる、淡い虹色</div></article></section>
<footer><span id="status" role="status">仲間たちを準備しています…</span><a href="/character-preview" style="color:inherit">おうちの景色で見る →</a></footer></main>
<script type="module">
import {createEvolvedRenderer} from './renderer.js?v=4';
const canvases=[...document.querySelectorAll('canvas')],renderers=[];
let yaw=0,pitch=0,auto=false,happy=false,night=false,dirty=true,raf=0,last=0;
const pose=()=>({rx:pitch,ry:yaw,rz:0,blink:0,happy,sleepy:false,night,mouthOpen:0,chew:0,smoking:false});
try{for(const canvas of canvases){canvas.width=canvas.height=Math.min(640,Math.round(canvas.clientWidth*Math.min(devicePixelRatio,2)));renderers.push(createEvolvedRenderer(canvas,canvas.dataset.form));}document.querySelector('#status').textContent='3体とも立体表示できました';}catch(error){document.querySelector('#status').textContent='立体表示を開けませんでした。対応するブラウザでお試しください。';console.error(error);}
function draw(time){raf=0;if(document.hidden)return;if(time-last>1000/30){last=time;if(auto){yaw+=.009;dirty=true;}if(dirty){for(const r of renderers)r.render(pose());dirty=false;}}if(auto||dirty)raf=requestAnimationFrame(draw);}
function invalidate(){dirty=true;if(!raf)raf=requestAnimationFrame(draw);}function stopAuto(){auto=false;document.querySelector('#auto').setAttribute('aria-pressed','false');document.querySelector('#auto').textContent='ゆっくり回す';}
for(const button of document.querySelectorAll('[data-yaw],[data-pitch]'))button.onclick=()=>{stopAuto();yaw=Number(button.dataset.yaw||0);pitch=Number(button.dataset.pitch||0);for(const b of document.querySelectorAll('[data-yaw],[data-pitch]'))b.setAttribute('aria-pressed',String(b===button));invalidate();};
document.querySelector('#auto').onclick=e=>{auto=!auto;e.target.setAttribute('aria-pressed',String(auto));e.target.textContent=auto?'回転を止める':'ゆっくり回す';invalidate();};
document.querySelector('#smile').onclick=e=>{happy=!happy;e.target.setAttribute('aria-pressed',String(happy));invalidate();};
document.querySelector('#night').onclick=e=>{night=!night;document.body.classList.toggle('night',night);e.target.setAttribute('aria-pressed',String(night));invalidate();};
for(const canvas of canvases){let start=null;canvas.onpointerdown=e=>{stopAuto();start={x:e.clientX,y:e.clientY,yaw,pitch};canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(!start)return;yaw=start.yaw+(e.clientX-start.x)*.014;pitch=Math.max(-Math.PI,Math.min(Math.PI,start.pitch+(e.clientY-start.y)*.012));invalidate();};canvas.onpointerup=canvas.onpointercancel=()=>start=null;canvas.onkeydown=e=>{if(!e.key.startsWith('Arrow'))return;e.preventDefault();stopAuto();if(e.key==='ArrowLeft')yaw-=.15;if(e.key==='ArrowRight')yaw+=.15;if(e.key==='ArrowUp')pitch-=.15;if(e.key==='ArrowDown')pitch+=.15;invalidate();};}
document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);raf=0;if(!document.hidden)invalidate();});window.addEventListener('resize',()=>{for(const c of canvases)c.width=c.height=Math.min(640,Math.round(c.clientWidth*Math.min(devicePixelRatio,2)));invalidate();});window.addEventListener('pagehide',()=>{cancelAnimationFrame(raf);renderers.forEach(r=>r.dispose());});invalidate();
</script></html>
