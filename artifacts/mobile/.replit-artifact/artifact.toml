kind = "mobile"
previewPath = "/"
title = "メントレ"
version = "1.0.0"
id = "artifacts/mobile"

[[services]]
name = "expo"
paths = [ "/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "node", "artifacts/mobile/server/serve.js" ]

[services.env]
PORT = "18115"
BASE_PATH = "/"
