openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: account
    description: Account and user data operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /account:
    delete:
      operationId: deleteAccount
      tags: [account]
      summary: Delete the authenticated user's account data
      description: Permanently removes the authenticated user's app data. The client then removes the Clerk identity.
      responses:
        "200":
          description: Account data deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Account data deletion failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AccountDeletionResponse:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

