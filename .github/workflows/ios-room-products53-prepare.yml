name: Verify TestFlight 52 and prepare room product catalog
on:
  push:
    branches: [release/room-products53-prepare-20261108]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yoki-room-products53-prepare
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: macos-26
    timeout-minutes: 15
    defaults:
      run:
        working-directory: artifacts/mobile
    env:
      YOKI_ASC_PRIVATE_KEY: ${{ secrets.YOKI_ASC_PRIVATE_KEY }}
      YOKI_ASC_KEY_ID: ${{ secrets.YOKI_ASC_KEY_ID }}
      YOKI_ASC_ISSUER_ID: ${{ secrets.YOKI_ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify existing build 52 through documented group endpoint
        env:
          YOKI_RELEASE_MODE: testflight
        run: python3 scripts/apple-review52.py
      - name: Prepare the seven room product drafts and localizations
        if: always()
        env:
          YOKI_PRODUCTS_MODE: metadata
        run: python3 scripts/apple-products53.py
      - name: Remove temporary API keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/yoki-upload52/private_keys" "$RUNNER_TEMP/yoki-products53/private_keys"
