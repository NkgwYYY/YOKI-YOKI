name: YOKI YOKI 1.2.5 (51) distribution and Apple upload
'on':
  push:
    branches:
    - release/home-closet51-20261108
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: yokiyoki-distribution-51
  cancel-in-progress: false
jobs:
  archive:
    runs-on: macos-26
    timeout-minutes: 75
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_BATTLE_ADS_TEST_MODE: 'false'
      EXPO_PUBLIC_DOMAIN: yoki-yoki.replit.app
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsueW9raS15b2tpLnJlcGxpdC5hcHAk
      EXPO_PUBLIC_CLERK_PROXY_URL: https://yoki-yoki.replit.app/api/__clerk
      EXPO_PUBLIC_ADS_TEST_MODE: 'false'
    defaults:
      run:
        working-directory: artifacts/mobile
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - name: Check Apple access and existing release before building
      id: preflight
      env:
        YOKI_ASC_PRIVATE_KEY: ${{ secrets.YOKI_ASC_PRIVATE_KEY }}
        YOKI_ASC_KEY_ID: ${{ secrets.YOKI_ASC_KEY_ID }}
        YOKI_ASC_ISSUER_ID: ${{ secrets.YOKI_ASC_ISSUER_ID }}
      run: python3 scripts/apple-preflight51.py
    - name: Check existing signing inputs without exposing credentials
      if: steps.preflight.outputs.already_uploaded != 'true'
      env:
        YOKI_DISTRIBUTION_P12_BASE64: ${{ secrets.YOKI_DISTRIBUTION_P12_BASE64 }}
        YOKI_DISTRIBUTION_P12_PASSWORD: ${{ secrets.YOKI_DISTRIBUTION_P12_PASSWORD }}
        YOKI_PROVISIONING_PROFILE_BASE64: ${{ secrets.YOKI_PROVISIONING_PROFILE_BASE64 }}
      run: |-
        python3 - <<'PYINPUTS'
        import os
        required = ['YOKI_DISTRIBUTION_P12_BASE64','YOKI_DISTRIBUTION_P12_PASSWORD','YOKI_PROVISIONING_PROFILE_BASE64']
        missing = [name for name in required if not os.environ.get(name)]
        if missing:
            raise SystemExit('Distribution signing is not configured: ' + ', '.join(missing) + '. No build or upload was attempted.')
        print('All three existing signing inputs are available; credential values are not displayed.')
        PYINPUTS
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 22.16.0
    - name: Install frozen dependencies
      working-directory: .
      run: |
        npm install --global pnpm@10.11.0
        pnpm install --frozen-lockfile --ignore-scripts
      if: steps.preflight.outputs.already_uploaded != 'true'
    - name: Check exact distribution source and generate native project
      run: |
        pnpm typecheck
        node --experimental-strip-types --test tests/homeView.test.mjs tests/homeBattleEntry.test.mjs tests/firstSteps.test.mjs tests/dailyCheckin.test.mjs tests/costumePurchases.test.mjs tests/residentStartup.test.mjs tests/evolvedVolume.test.mjs tests/recovery42.test.mjs tests/moyamoya.test.mjs tests/moyamoyaVariety.test.mjs tests/odangoGeometry.test.mjs tests/dailyRewardPolicyTransport.test.mjs tests/nativeRewardedLifecycle.test.mjs tests/rewardAvailability.test.mjs tests/dailyRecordTransaction.test.mjs tests/checklistTransaction.test.mjs tests/exchangeDiary.test.mjs tests/companionCollection.test.mjs tests/battleInterstitial.test.mjs tests/commerceNativeAds.test.mjs tests/dailyAdsIntegration.test.mjs tests/dailyAdPlacements.test.mjs
        node scripts/build-native-resident.mjs --check
        pnpm exec expo prebuild --platform ios --no-install
        cd ios
        pod install
      if: steps.preflight.outputs.already_uploaded != 'true'
    - name: Archive and export with existing Apple distribution identity
      env:
        YOKI_DISTRIBUTION_P12_BASE64: ${{ secrets.YOKI_DISTRIBUTION_P12_BASE64 }}
        YOKI_DISTRIBUTION_P12_PASSWORD: ${{ secrets.YOKI_DISTRIBUTION_P12_PASSWORD }}
        YOKI_PROVISIONING_PROFILE_BASE64: ${{ secrets.YOKI_PROVISIONING_PROFILE_BASE64 }}
      run: bash scripts/sign-ios-release51.sh
      if: steps.preflight.outputs.already_uploaded != 'true'
    - name: Preserve signed IPA and diagnostics only
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: yokiyoki-1.2.5-51-distribution
        retention-days: 3
        path: |
          artifacts/mobile/release51-results/export/*.ipa
          artifacts/mobile/release51-results/*.log
          artifacts/mobile/release51-results/*.txt
          artifacts/mobile/release51-results/entitlements.plist
    - name: Upload verified signed build 51 to Apple
      if: steps.preflight.outputs.already_uploaded != 'true'
      env:
        YOKI_ASC_KEY_ID: ${{ secrets.YOKI_ASC_KEY_ID }}
        YOKI_ASC_ISSUER_ID: ${{ secrets.YOKI_ASC_ISSUER_ID }}
      run: |
        set -euo pipefail
        work="$RUNNER_TEMP/yoki-upload51"
        cp release51-results/export/YOKIYOKI.ipa "$work/YOKIYOKI.ipa"
        cd "$work"
        key_id="$(printf '%s' "$YOKI_ASC_KEY_ID" | tr -d '[:space:]')"
        issuer_id="$(printf '%s' "$YOKI_ASC_ISSUER_ID" | tr -d '[:space:]')"
        xcrun altool --upload-app --file "$PWD/YOKIYOKI.ipa" --type ios --apiKey "$key_id" --apiIssuer "$issuer_id"
        echo 'Apple upload completed; processing and review submission are separate steps.'
    - name: Remove temporary Apple upload key
      if: always()
      run: rm -rf -- "$RUNNER_TEMP/yoki-upload51"
