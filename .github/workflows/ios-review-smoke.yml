name: iOS review smoke
on:
  push:
    branches: [codex/ios-placement-review-20261029, codex/ios-welcome-quality-20261030, codex/ios-room-prefetch-20261030, codex/ios-review-credential-prompt-20261030, release/ios-101-ads-fix-20261031, release/ios-101-startup-fix-20261101, release/ios-110-companion-insights-20261101]
    paths:
      - .github/workflows/ios-review-smoke.yml
      - artifacts/mobile/**
      - pnpm-lock.yaml
      - docs/qa/ios-review-simulator.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-review-${{ github.ref }}
  # Obsolete candidates must not delay the current review build.
  cancel-in-progress: true
jobs:
  native_review:
    # Standard arm64 runner: free for this public repository. No larger runner.
    runs-on: macos-26
    timeout-minutes: 75
    # Keep each simulator on a fresh runner. A timed-out shutdown must not
    # prevent the next device from becoming an Xcode destination.
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: iPhone
            family: iPhone
            egg: '0'
            test_class: ReviewJourneys
          - scenario: iPhoneEgg
            family: iPhone
            egg: '1'
            test_class: EggAppearanceJourney
          - scenario: iPad
            family: iPad
            egg: '0'
            test_class: ReviewJourneys
    env:
      CI: 'true'
      YOKI_REVIEW_CASE: ${{ matrix.scenario }}
      YOKI_TEST_CLASS: ${{ matrix.test_class }}
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_AUTH_DIAGNOSTICS: '1'
      EXPO_PUBLIC_RENDERER_DIAGNOSTICS: '1'
      EXPO_PUBLIC_DOMAIN: yoki-yoki.replit.app
      # Public client identifier for the same account instance as the web app.
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsueW9raS15b2tpLnJlcGxpdC5hcHAk
      EXPO_PUBLIC_CLERK_PROXY_URL: https://yoki-yoki.replit.app/api/__clerk
    defaults:
      run:
        working-directory: artifacts/mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.16.0'
      - name: Install frozen workspace dependencies
        working-directory: .
        run: |
          npm install --global pnpm@10.11.0
          pnpm install --frozen-lockfile
      - name: Verify account isolation, speech motion and renderer parity
        run: |
          pnpm typecheck
          node --experimental-strip-types --test tests/conditionTrends.test.mjs tests/dailyRecordTransaction.test.mjs tests/residentLocomotion.test.mjs
          node --experimental-strip-types --test tests/accountCache.test.mjs tests/residentSpeechMotion.test.mjs tests/residentSpeech.test.mjs tests/residentWelcome.test.mjs tests/starterFurnishings.test.mjs tests/roomPurchase.test.mjs tests/roomPlacement.test.mjs tests/personalInsights.test.mjs tests/hintBook.test.mjs tests/conversationStorage.test.mjs
          node --test tests/dailyAdPlacements.test.mjs tests/dailyAdStore.test.mjs tests/dailyAdsIntegration.test.mjs tests/dailyAdsExpiry.test.mjs tests/commerceNativeAds.test.mjs tests/nativeRewardedLifecycle.test.mjs
          node scripts/build-native-resident.mjs --check
      - name: Verify iOS JavaScript bundle before native compilation
        run: pnpm exec expo export --platform ios --output-dir "$RUNNER_TEMP/yoki-ios-export" --max-workers 2
      - name: Generate native project from the reviewed public source
        run: |
          pnpm exec expo prebuild --platform ios --no-install
          cd ios
          pod install
      - name: Compile a Release simulator app without Apple credentials
        run: |
          mkdir -p review-results
          xcodebuild -workspace ios/YOKIYOKI.xcworkspace -scheme YOKIYOKI -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/yoki-derived" -jobs 2 ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build > review-results/xcodebuild.log 2>&1 || { tail -100 review-results/xcodebuild.log; exit 1; }
          echo "YOKI_LOCAL_SIM_APP=$RUNNER_TEMP/yoki-derived/Build/Products/Release-iphonesimulator/YOKIYOKI.app" >> "$GITHUB_ENV"
      - name: Preserve simulator signing diagnostics
        run: |
          codesign -dvv "$YOKI_LOCAL_SIM_APP" > review-results/simulator-signature.log 2>&1
          codesign -d --entitlements :- "$YOKI_LOCAL_SIM_APP" > review-results/simulator-entitlements.plist 2>/dev/null || true
      - name: Prepare the native UI test runner
        run: |
          gem install xcodeproj --version 1.27.0 --no-document
          ruby scripts/create-review-xctest.rb "$RUNNER_TEMP/yoki-review-xctest"
      - name: Test native review journeys on ${{ matrix.scenario }}
        id: journeys
        continue-on-error: true
        env:
          DEVICE_FAMILY: ${{ matrix.family }}
          YOKI_QA_EGG: ${{ matrix.egg }}
        run: |
          set -o pipefail
          python3 scripts/prepare-ios-review.py
          YOKI_TEST_UDID=$(cat "review-results/$YOKI_REVIEW_CASE/device-id.txt")
          xcodebuild -project "$RUNNER_TEMP/yoki-review-xctest/YokiReview.xcodeproj" -scheme YokiReviewUITests -configuration Release -sdk iphonesimulator -destination "platform=iOS Simulator,id=$YOKI_TEST_UDID" -destination-timeout 180 -derivedDataPath "$RUNNER_TEMP/yoki-test-derived" -resultBundlePath "review-results/$YOKI_REVIEW_CASE/native.xcresult" -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO "-only-testing:YokiReviewUITests/$YOKI_TEST_CLASS" test 2>&1 | tee "review-results/$YOKI_REVIEW_CASE/xctest.log"
      - name: Preserve native test evidence and stop simulator
        if: always() && steps.journeys.outcome != 'skipped'
        run: |
          if [ -f "review-results/$YOKI_REVIEW_CASE/device-id.txt" ]; then
            python3 scripts/finish-ios-review.py "$YOKI_REVIEW_CASE"
            if [ -d "review-results/$YOKI_REVIEW_CASE/native.xcresult" ]; then
              xcrun xcresulttool export attachments --path "review-results/$YOKI_REVIEW_CASE/native.xcresult" --output-path "review-results/$YOKI_REVIEW_CASE/attachments" || true
              xcrun xcresulttool get test-results summary --path "review-results/$YOKI_REVIEW_CASE/native.xcresult" > "review-results/$YOKI_REVIEW_CASE/summary.json" || true
            fi
          fi
      - name: Upload synthetic test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-review-native-${{ matrix.scenario }}
          retention-days: 7
          path: |
            artifacts/mobile/review-results/
            !artifacts/mobile/review-results/**/native.xcresult/**
            !artifacts/mobile/review-results/**/*.mp4
            !artifacts/mobile/review-results/**/*.mov
      - name: Require the actual native test outcome to pass
        if: always()
        env:
          JOURNEY_RESULT: ${{ steps.journeys.outcome }}
        run: |
          printf 'Actual test outcome: %s=%s\n' "$YOKI_REVIEW_CASE" "$JOURNEY_RESULT"
          test "$JOURNEY_RESULT" = success
