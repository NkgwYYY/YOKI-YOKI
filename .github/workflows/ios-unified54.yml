name: YOKI YOKI 1.2.6 (54) unified records, native verification and TestFlight
on:
  push:
    branches: [release/unified54-20261108]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unified54-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 75
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_DOMAIN: yoki-yoki.replit.app
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsueW9raS15b2tpLnJlcGxpdC5hcHAk
      EXPO_PUBLIC_CLERK_PROXY_URL: https://yoki-yoki.replit.app/api/__clerk
    defaults:
      run:
        working-directory: artifacts/mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.16.0'
      - name: Install frozen workspace dependencies
        working-directory: .
        run: |
          npm install --global pnpm@10.11.0
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Check candidate source
        run: |
          pnpm typecheck
          node --experimental-strip-types --test tests/roomBoutique.test.mjs tests/roomPurchase.test.mjs tests/costumePurchases.test.mjs tests/residentStartup.test.mjs tests/evolvedVolume.test.mjs tests/recovery42.test.mjs tests/moyamoya.test.mjs tests/conditionTrends.test.mjs tests/lifeTrends.test.mjs tests/personalInsights.test.mjs tests/dailyRecordTransaction.test.mjs tests/checklistTransaction.test.mjs tests/exchangeDiary.test.mjs tests/companionCollection.test.mjs
          node scripts/build-native-resident.mjs --check
          pnpm exec expo export --platform ios --output-dir "$RUNNER_TEMP/yoki-ios-export" --max-workers 2
      - name: Generate native project
        run: |
          pnpm exec expo prebuild --platform ios --no-install
          cd ios
          pod install
      - name: Link native UI tests to the simulator application
        run: |
          gem install xcodeproj --version 1.27.0 --no-document
          ruby -c scripts/create-release54-xctest.rb
          ruby scripts/create-release54-xctest.rb
      - name: Compile complete Release simulator app and native tests
        run: |
          mkdir -p native54-results
          xcodebuild -version > native54-results/xcode-version.txt
          xcodebuild -workspace ios/YOKIYOKI.xcworkspace -scheme YokiReleaseUITests -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/yoki-derived" -jobs 2 ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build-for-testing > native54-results/xcodebuild.log 2>&1 || { tail -100 native54-results/xcodebuild.log; exit 1; }
          app="$RUNNER_TEMP/yoki-derived/Build/Products/Release-iphonesimulator/YOKIYOKI.app"
          test -f "$app/Info.plist"
          /usr/libexec/PlistBuddy -c Print "$app/Info.plist" > native54-results/app-info.txt
          codesign -dvv "$app" > native54-results/signature.txt 2>&1
          shasum -a 256 modules/yoki-stones/ios/*.swift utils/nativeResidentBundle.ts > native54-results/source-hashes.txt
          printf '%s\n' "$GITHUB_SHA" > native54-results/source-commit.txt
          ditto -c -k --sequesterRsrc --keepParent "$app" native54-results/YOKIYOKI-simulator.zip
      - name: Install native journey runner
        run: |
          echo "YOKI_LOCAL_SIM_APP=$RUNNER_TEMP/yoki-derived/Build/Products/Release-iphonesimulator/YOKIYOKI.app" >> "$GITHUB_ENV"
      - name: Prepare isolated room-purchase simulator
        env:
          DEVICE_FAMILY: iPhone
          YOKI_QA_EGG: '0'
          YOKI_QA_ROOMS: '1'
          YOKI_QA_STOREKIT: '1'
        run: python3 scripts/prepare-ios-review.py
      - name: Exercise room previews, point exchange, StoreKit purchase and restoration
        id: journeys
        continue-on-error: true
        run: |
          xcodebuild -workspace ios/YOKIYOKI.xcworkspace -scheme YokiReleaseUITests -configuration Release -sdk iphonesimulator -destination "platform=iOS Simulator,id=$YOKI_SIMULATOR_UDID" -destination-timeout 180 -derivedDataPath "$RUNNER_TEMP/yoki-derived" -resultBundlePath review-results/iPhone/native.xcresult -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- '-only-testing:YokiReleaseUITests/RoomReleaseJourney54' test-without-building > review-results/iPhone/xctest.log 2>&1 || { tail -100 review-results/iPhone/xctest.log; exit 1; }
      - name: Prepare isolated daily-record simulator
        env:
          DEVICE_FAMILY: iPhone
          YOKI_QA_EGG: '0'
          YOKI_QA_RECORD: '1'
        run: |
          xcrun simctl shutdown "$YOKI_SIMULATOR_UDID"
          python3 scripts/prepare-ios-review.py
      - name: Exercise daily startup, optional answers, graphs and battle
        id: record_journeys
        continue-on-error: true
        run: |
          xcodebuild -workspace ios/YOKIYOKI.xcworkspace -scheme YokiReleaseUITests -configuration Release -sdk iphonesimulator -destination "platform=iOS Simulator,id=$YOKI_SIMULATOR_UDID" -destination-timeout 180 -derivedDataPath "$RUNNER_TEMP/yoki-derived" -resultBundlePath review-results/iPhoneRecord/native.xcresult -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- '-only-testing:YokiReleaseUITests/RecordReleaseJourney54' test-without-building > review-results/iPhoneRecord/xctest.log 2>&1 || { tail -100 review-results/iPhoneRecord/xctest.log; exit 1; }
      - name: Export native test evidence
        if: always()
        run: |
          if [ -d review-results/iPhone/native.xcresult ]; then
            xcrun xcresulttool export attachments --path review-results/iPhone/native.xcresult --output-path native54-results/attachments || true
            xcrun xcresulttool get test-results summary --path review-results/iPhone/native.xcresult > native54-results/test-summary.json || true
          fi
          cp review-results/iPhone/xctest.log native54-results/ 2>/dev/null || true
          cp review-results/iPhone/available-runtimes.json native54-results/ 2>/dev/null || true
          cp review-results/iPhone/environment.json native54-results/ 2>/dev/null || true
          if [ -d review-results/iPhoneRecord/native.xcresult ]; then
            xcrun xcresulttool export attachments --path review-results/iPhoneRecord/native.xcresult --output-path native54-results/record-attachments || true
            xcrun xcresulttool get test-results summary --path review-results/iPhoneRecord/native.xcresult > native54-results/record-test-summary.json || true
          fi
          cp review-results/iPhoneRecord/xctest.log native54-results/record-xctest.log 2>/dev/null || true
          cp review-results/iPhoneRecord/environment.json native54-results/record-environment.json 2>/dev/null || true
          cp ios/YOKIYOKI.xcodeproj/xcshareddata/xcschemes/YokiReleaseUITests.xcscheme native54-results/ 2>/dev/null || true
      - name: Preserve build and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yokiyoki-unified54-native
          retention-days: 7
          path: artifacts/mobile/native54-results/
      - name: Require successful native journey
        if: always()
        env:
          OUTCOME: ${{ steps.journeys.outcome }}
          RECORD_OUTCOME: ${{ steps.record_journeys.outcome }}
        run: |
          test "$OUTCOME" = success
          test "$RECORD_OUTCOME" = success

  archive:
    runs-on: macos-26
    timeout-minutes: 75
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_BATTLE_ADS_TEST_MODE: 'false'
      EXPO_PUBLIC_DOMAIN: yoki-yoki.replit.app
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsueW9raS15b2tpLnJlcGxpdC5hcHAk
      EXPO_PUBLIC_CLERK_PROXY_URL: https://yoki-yoki.replit.app/api/__clerk
      EXPO_PUBLIC_ADS_TEST_MODE: 'false'
    defaults:
      run:
        working-directory: artifacts/mobile
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - name: Check Apple access and existing release before building
      id: preflight
      env:
        YOKI_ASC_PRIVATE_KEY: ${{ secrets.YOKI_ASC_PRIVATE_KEY }}
        YOKI_ASC_KEY_ID: ${{ secrets.YOKI_ASC_KEY_ID }}
        YOKI_ASC_ISSUER_ID: ${{ secrets.YOKI_ASC_ISSUER_ID }}
      run: python3 scripts/apple-preflight54.py
    - name: Check existing signing inputs without exposing credentials
      if: steps.preflight.outputs.already_uploaded != 'true'
      env:
        YOKI_DISTRIBUTION_P12_BASE64: ${{ secrets.YOKI_DISTRIBUTION_P12_BASE64 }}
        YOKI_DISTRIBUTION_P12_PASSWORD: ${{ secrets.YOKI_DISTRIBUTION_P12_PASSWORD }}
        YOKI_PROVISIONING_PROFILE_BASE64: ${{ secrets.YOKI_PROVISIONING_PROFILE_BASE64 }}
      run: |-
        python3 - <<'PYINPUTS'
        import os
        required = ['YOKI_DISTRIBUTION_P12_BASE64','YOKI_DISTRIBUTION_P12_PASSWORD','YOKI_PROVISIONING_PROFILE_BASE64']
        missing = [name for name in required if not os.environ.get(name)]
        if missing:
            raise SystemExit('Distribution signing is not configured: ' + ', '.join(missing) + '. No build or upload was attempted.')
        print('All three existing signing inputs are available; credential values are not displayed.')
        PYINPUTS
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 22.16.0
    - name: Install frozen dependencies
      working-directory: .
      run: |
        npm install --global pnpm@10.11.0
        pnpm install --frozen-lockfile --ignore-scripts
      if: steps.preflight.outputs.already_uploaded != 'true'
    - name: Check exact distribution source and generate native project
      run: |
        pnpm typecheck
        node --experimental-strip-types --test tests/roomBoutique.test.mjs tests/roomPurchase.test.mjs tests/homeView.test.mjs tests/homeBattleEntry.test.mjs tests/starterFurnishings.test.mjs tests/firstSteps.test.mjs tests/dailyCheckin.test.mjs tests/costumePurchases.test.mjs tests/residentStartup.test.mjs tests/evolvedVolume.test.mjs tests/recovery42.test.mjs tests/moyamoya.test.mjs tests/moyamoyaVariety.test.mjs tests/odangoGeometry.test.mjs tests/dailyRewardPolicyTransport.test.mjs tests/nativeRewardedLifecycle.test.mjs tests/rewardAvailability.test.mjs tests/conditionTrends.test.mjs tests/lifeTrends.test.mjs tests/personalInsights.test.mjs tests/dailyRecordTransaction.test.mjs tests/checklistTransaction.test.mjs tests/exchangeDiary.test.mjs tests/companionCollection.test.mjs tests/battleInterstitial.test.mjs tests/commerceNativeAds.test.mjs tests/dailyAdsIntegration.test.mjs tests/dailyAdPlacements.test.mjs
        node scripts/build-native-resident.mjs --check
        pnpm exec expo prebuild --platform ios --no-install
        cd ios
        pod install
      if: steps.preflight.outputs.already_uploaded != 'true'
    - name: Archive and export with existing Apple distribution identity
      env:
        YOKI_DISTRIBUTION_P12_BASE64: ${{ secrets.YOKI_DISTRIBUTION_P12_BASE64 }}
        YOKI_DISTRIBUTION_P12_PASSWORD: ${{ secrets.YOKI_DISTRIBUTION_P12_PASSWORD }}
        YOKI_PROVISIONING_PROFILE_BASE64: ${{ secrets.YOKI_PROVISIONING_PROFILE_BASE64 }}
      run: bash scripts/sign-ios-release54.sh
      if: steps.preflight.outputs.already_uploaded != 'true'
    - name: Preserve signed IPA and diagnostics only
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: yokiyoki-1.2.6-54-distribution
        retention-days: 3
        path: |
          artifacts/mobile/release54-results/export/*.ipa
          artifacts/mobile/release54-results/*.log
          artifacts/mobile/release54-results/*.txt
          artifacts/mobile/release54-results/entitlements.plist
    - name: Remove temporary Apple upload key
      if: always()
      run: rm -rf -- "$RUNNER_TEMP/yoki-upload54"
  upload:
    needs: [simulator, archive]
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: artifacts/mobile
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - name: Check target build and prepare ephemeral Apple upload key
      id: preflight
      env:
        YOKI_ASC_PRIVATE_KEY: ${{ secrets.YOKI_ASC_PRIVATE_KEY }}
        YOKI_ASC_KEY_ID: ${{ secrets.YOKI_ASC_KEY_ID }}
        YOKI_ASC_ISSUER_ID: ${{ secrets.YOKI_ASC_ISSUER_ID }}
      run: python3 scripts/apple-preflight54.py
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: steps.preflight.outputs.already_uploaded != 'true'
      with:
        name: yokiyoki-1.2.6-54-distribution
        path: artifacts/mobile/release54-results
    - name: Upload verified signed build 54 to Apple
      if: steps.preflight.outputs.already_uploaded != 'true'
      env:
        YOKI_ASC_KEY_ID: ${{ secrets.YOKI_ASC_KEY_ID }}
        YOKI_ASC_ISSUER_ID: ${{ secrets.YOKI_ASC_ISSUER_ID }}
      run: |
        set -euo pipefail
        work="$RUNNER_TEMP/yoki-upload54"
        cp release54-results/export/YOKIYOKI.ipa "$work/YOKIYOKI.ipa"
        cd "$work"
        key_id="$(printf '%s' "$YOKI_ASC_KEY_ID" | tr -d '[:space:]')"
        issuer_id="$(printf '%s' "$YOKI_ASC_ISSUER_ID" | tr -d '[:space:]')"
        xcrun altool --upload-app --file "$PWD/YOKIYOKI.ipa" --type ios --apiKey "$key_id" --apiIssuer "$issuer_id"
        echo 'Apple upload completed; processing and review submission are separate steps.'
    - name: Verify processing and existing internal TestFlight distribution
      env:
        YOKI_ASC_PRIVATE_KEY: ${{ secrets.YOKI_ASC_PRIVATE_KEY }}
        YOKI_ASC_KEY_ID: ${{ secrets.YOKI_ASC_KEY_ID }}
        YOKI_ASC_ISSUER_ID: ${{ secrets.YOKI_ASC_ISSUER_ID }}
        YOKI_RELEASE_MODE: testflight
      run: python3 scripts/apple-review54.py
    - name: Remove temporary Apple upload key
      if: always()
      run: rm -rf -- "$RUNNER_TEMP/yoki-upload54"
