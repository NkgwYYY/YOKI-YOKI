name: Startup, sourced battles and reward points verification
on:
  push:
    branches: [fix/startup-battles-rewards-20261107]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: startup-battles-rewards-${{ github.sha }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      TZ: Asia/Tokyo
    defaults:
      run:
        working-directory: artifacts/mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install frozen dependencies
        working-directory: .
        run: |
          npm install --global pnpm@10.11.0
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Check types, renderer and regressions
        run: |
          pnpm typecheck
          node scripts/build-native-resident.mjs --check
          node --test tests/residentStartup.test.mjs tests/odangoGeometry.test.mjs tests/firstSteps.test.mjs tests/dailyCheckin.test.mjs tests/dailyRecordTransaction.test.mjs tests/moyamoya*.test.mjs tests/dailyAd*.test.mjs tests/communityBonus.test.mjs tests/nativeRewardedLifecycle.test.mjs tests/rewardAvailability.test.mjs tests/battleInterstitial.test.mjs
      - name: Export browser and iOS bundles
        run: |
          pnpm exec expo export --platform web --output-dir "$RUNNER_TEMP/yoki-web"
          pnpm exec expo export --platform ios --output-dir "$RUNNER_TEMP/yoki-ios"
      - name: Prepare browser test runner
        run: |
          npm install --prefix "$RUNNER_TEMP/yoki-browser" --no-save --ignore-scripts --no-audit --no-fund playwright@1.62.1
          TEST_BROWSER=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$TEST_BROWSER" ]; then
            echo "YOKI_QA_BROWSER=$TEST_BROWSER" >> "$GITHUB_ENV"
          else
            node "$RUNNER_TEMP/yoki-browser/node_modules/playwright/cli.js" install chromium
          fi
      - name: Verify small-screen journeys
        env:
          YOKI_QA_EXPORT: ${{ runner.temp }}/yoki-web
          YOKI_QA_PLAYWRIGHT: ${{ runner.temp }}/yoki-browser/node_modules/playwright
        run: |
          node tests/startupCheckin.browser.cjs
          node tests/startupBattlesRewards.browser.cjs
