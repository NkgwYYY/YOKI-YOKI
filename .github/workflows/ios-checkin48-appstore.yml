name: YOKI YOKI 1.2.4 (48) distribution archive
on:
  push:
    branches: [release/checkin48-appstore-20261106]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yokiyoki-distribution-48
  cancel-in-progress: false
jobs:
  archive:
    runs-on: macos-26
    timeout-minutes: 75
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_BATTLE_ADS_TEST_MODE: 'false'
      EXPO_PUBLIC_DOMAIN: yoki-yoki.replit.app
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsueW9raS15b2tpLnJlcGxpdC5hcHAk
      EXPO_PUBLIC_CLERK_PROXY_URL: https://yoki-yoki.replit.app/api/__clerk
    defaults:
      run:
        working-directory: artifacts/mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.16.0'
      - name: Install frozen dependencies
        working-directory: .
        run: |
          npm install --global pnpm@10.11.0
          pnpm install --frozen-lockfile
      - name: Check exact distribution source and generate native project
        run: |
          pnpm typecheck
          node --experimental-strip-types --test tests/firstSteps.test.mjs tests/dailyCheckin.test.mjs tests/costumePurchases.test.mjs tests/residentStartup.test.mjs tests/evolvedVolume.test.mjs tests/recovery42.test.mjs tests/moyamoya.test.mjs tests/dailyRecordTransaction.test.mjs tests/checklistTransaction.test.mjs tests/exchangeDiary.test.mjs tests/companionCollection.test.mjs tests/battleInterstitial.test.mjs tests/commerceNativeAds.test.mjs tests/dailyAdsIntegration.test.mjs
          node scripts/build-native-resident.mjs --check
          pnpm exec expo prebuild --platform ios --no-install
          cd ios
          pod install
      - name: Archive and export with existing Apple distribution identity
        env:
          YOKI_DISTRIBUTION_P12_BASE64: ${{ secrets.YOKI_DISTRIBUTION_P12_BASE64 }}
          YOKI_DISTRIBUTION_P12_PASSWORD: ${{ secrets.YOKI_DISTRIBUTION_P12_PASSWORD }}
          YOKI_PROVISIONING_PROFILE_BASE64: ${{ secrets.YOKI_PROVISIONING_PROFILE_BASE64 }}
        run: bash scripts/sign-ios-release48.sh
      - name: Preserve signed IPA and diagnostics only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yokiyoki-1.2.4-48-distribution
          retention-days: 3
          path: |
            artifacts/mobile/release48-results/export/*.ipa
            artifacts/mobile/release48-results/*.log
            artifacts/mobile/release48-results/*.txt
            artifacts/mobile/release48-results/entitlements.plist
